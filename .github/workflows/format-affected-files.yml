name: Format affected files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prettier --write server/src/routes/cart.test.ts server/src/routes/catalog.test.ts server/src/schemas/commerce.ts src/app/App.tsx src/shared/api/client.ts
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/routes/cart.test.ts server/src/routes/catalog.test.ts server/src/schemas/commerce.ts src/app/App.tsx src/shared/api/client.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format catalogue and cart changes [skip format]"
            git push origin main
          fi
