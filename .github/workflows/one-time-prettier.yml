name: Temporary formatter

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Format storefront files
        run: npx --yes prettier@3.6.2 --write src/app/App.tsx src/app/App.test.tsx
      - name: Commit formatting
        run: |
          git add src/app/App.tsx src/app/App.test.tsx
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format checkout test updates"
          git push origin HEAD:main
