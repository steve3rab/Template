name: Apply Prettier formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-prettier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Pin npm to a stable version
        run: npm install --global npm@10.9.4
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format changed application and test files
        run: >-
          npx prettier --write
          src/app/App.tsx
          src/app/App.test.tsx
          src/features/account/CustomerAccountData.tsx
          src/features/account/CustomerAccountData.test.tsx
          src/features/admin/AdminWorkspace.tsx
          src/features/admin/AdminWorkspace.test.tsx
          src/features/auth/AuthPanel.test.tsx
          src/features/auth/ResetPassword.tsx
          src/features/auth/ResetPassword.test.tsx
          src/features/seller/SellerWorkspace.tsx
          src/features/seller/SellerWorkspace.test.tsx
      - name: Commit formatted files to main
        run: |
          if git diff --quiet; then
            echo "All targeted files are already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/App.test.tsx src/features/account/CustomerAccountData.tsx src/features/account/CustomerAccountData.test.tsx src/features/admin/AdminWorkspace.tsx src/features/admin/AdminWorkspace.test.tsx src/features/auth/AuthPanel.test.tsx src/features/auth/ResetPassword.tsx src/features/auth/ResetPassword.test.tsx src/features/seller/SellerWorkspace.tsx src/features/seller/SellerWorkspace.test.tsx
          git commit -m "style: apply Prettier formatting to workspace changes"
          git push origin HEAD:main
