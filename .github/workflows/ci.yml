name: CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      APP_ORIGIN: http://localhost:5173
      SESSION_SECRET: ci-only-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v7
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem scripts -Filter '*.ps1' -File | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors)
            foreach ($parseError in $parseErrors) {
              $errors += "{0}:{1}:{2} {3}" -f $_.FullName, $parseError.Extent.StartLineNumber, $parseError.Extent.StartColumnNumber, $parseError.Message
            }
          }
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
          Write-Host 'PowerShell syntax validated for all scripts.'
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Pin npm to a stable version
        run: npm install --global npm@10.9.4
      - run: npm --version
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Verify migration history is fully applied
        run: npx prisma migrate status --schema server/prisma/schema.prisma
      - name: Verify SQLite and PostgreSQL Prisma models stay aligned
        run: npm run db:check-schema-parity
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Frontend coverage with regression thresholds
        run: npm run test:coverage
      - name: Backend coverage with regression thresholds
        run: npm run test:coverage:server
      - run: npm run build
      - run: npm run build:server
  e2e:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: file:./dev.db
      APP_ORIGIN: http://127.0.0.1:4173
      SESSION_SECRET: e2e-only-secret-that-is-long-enough-for-tests
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Pin npm to a stable version
        run: npm install --global npm@10.9.4
      - run: npm --version
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Seed isolated customer, seller and admin E2E accounts
        run: npm run db:seed:test-users
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  postgres-concurrency:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: template
          POSTGRES_PASSWORD: template-ci-password
          POSTGRES_DB: template_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U template -d template_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://template:template-ci-password@localhost:5432/template_test?schema=public
      DATABASE_URL_POSTGRES: postgresql://template:template-ci-password@localhost:5432/template_test?schema=public
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Pin npm to a stable version
        run: npm install --global npm@10.9.4
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run db:generate:postgres
      - run: npx prisma db push --schema server/prisma/schema.postgres.prisma
      - name: Verify concurrent stock reservations against PostgreSQL
        run: npx vitest run server/src/postgres-concurrency.test.ts

  windows-scripts:
    runs-on: windows-latest
    env:
      DATABASE_URL: file:./dev.db
      APP_ORIGIN: http://127.0.0.1:15173
      SESSION_SECRET: windows-ci-only-secret-that-is-long-enough
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm --version
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npm run db:generate
      - run: npm run db:deploy
      - name: Verify PowerShell helpers and Prisma schema checks
        shell: pwsh
        run: |
          . .\scripts\common.ps1
          Assert-Toolchain
          Assert-DependenciesInstalled
          Invoke-Npm -Arguments @('run', 'db:check-schema-parity')
      - name: Start and stop the full local stack
        shell: pwsh
        run: |
          try {
            .\scripts\dev-all.ps1 -FrontendPort 15173 -BackendPort 13001
            $api = Invoke-WebRequest -Uri 'http://127.0.0.1:13001/api/health' -TimeoutSec 10
            $web = Invoke-WebRequest -Uri 'http://127.0.0.1:15173/' -TimeoutSec 10
            if ($api.StatusCode -ne 200) { throw "API health check returned $($api.StatusCode)." }
            if ($web.StatusCode -ne 200) { throw "Frontend check returned $($web.StatusCode)." }
            Write-Host 'Frontend and API are reachable.'
          }
          finally {
            .\scripts\stop-dev-all.ps1
          }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: template-react:ci
