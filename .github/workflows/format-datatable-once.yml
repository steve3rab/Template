name: One-time DataTable formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm install --global npm@10.9.4
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format DataTable implementation and integrations
        run: |
          npx prettier --write \
            src/features/account/CustomerAccountData.tsx \
            src/features/admin/AdminWorkspace.tsx \
            src/features/seller/SellerWorkspace.tsx \
            src/shared/components/DataTable.tsx \
            src/styles.css
      - name: Commit formatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/account/CustomerAccountData.tsx src/features/admin/AdminWorkspace.tsx src/features/seller/SellerWorkspace.tsx src/shared/components/DataTable.tsx src/styles.css
            git commit -m "Format shared sortable data tables"
            git push origin HEAD:main
          else
            echo "All selected files are already formatted."
          fi
