name: Format workspace changes

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: "!contains(github.event.head_commit.message, '[skip format]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
          cache: npm
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - run: npx prettier --write src/features/seller/SellerWorkspace.tsx src/features/seller/SellerWorkspace.test.tsx src/features/admin/AdminWorkspace.tsx src/features/admin/AdminWorkspace.test.tsx src/features/account/CustomerAccountData.tsx src/features/account/CustomerAccountData.test.tsx server/src/routes/addresses.ts server/src/routes/addresses.test.ts src/styles.css
      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/features/seller/SellerWorkspace.tsx src/features/seller/SellerWorkspace.test.tsx src/features/admin/AdminWorkspace.tsx src/features/admin/AdminWorkspace.test.tsx src/features/account/CustomerAccountData.tsx src/features/account/CustomerAccountData.test.tsx server/src/routes/addresses.ts server/src/routes/addresses.test.ts src/styles.css
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: format seller customer and admin workspaces [skip format]"
            git push origin main
          fi
