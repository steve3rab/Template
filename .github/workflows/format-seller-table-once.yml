name: One-time seller table formatting

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - run: npm install --global npm@10.9.4
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format seller table files
        run: |
          npx prettier --write src/features/seller/SellerWorkspace.tsx src/styles.css
      - name: Commit formatted files
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/features/seller/SellerWorkspace.tsx src/styles.css
            git commit -m "Format seller management data table"
            git push origin HEAD:main
          else
            echo "Selected files already formatted."
          fi
