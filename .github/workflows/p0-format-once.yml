name: P0 one-time formatting repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/p0-format-once.yml'

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 22.16.0
      - name: Pin npm
        run: npm install --global npm@10.9.4
      - run: npm ci --legacy-peer-deps --no-audit --no-fund
      - name: Format the five files blocking P0 quality checks
        run: |
          npx prettier --write src/app/App.tsx src/app/App.test.tsx src/features/seller/SellerWorkspace.test.tsx src/styles.css server/src/routes/payments.test.ts
      - name: Commit formatting directly to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/App.tsx src/app/App.test.tsx src/features/seller/SellerWorkspace.test.tsx src/styles.css server/src/routes/payments.test.ts
          if git diff --cached --quiet; then
            echo "No formatting changes required."
          else
            git commit -m "style: apply Prettier to P0 quality blockers"
            git push origin main
          fi
